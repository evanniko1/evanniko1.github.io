name: github-activity

on:
  workflow_dispatch:
  schedule:
    - cron: "7 2 * * *"   # daily at 02:07 UTC (off-peak)
  push:
    branches: [main]
    paths:
      - ".github/workflows/github-activity.yml"
      - "scripts/generate-gh-contribs.js"

concurrency:
  group: generated-main-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  LOGIN: "evanniko1"
  OUT_DIR: "images"
  LIGHT_NAME: "github-activity-light.svg"
  DARK_NAME: "github-activity-dark.svg"
  TITLE: "GitHub contributions calendar for Evangelos Nikolados"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Generate SVGs via GitHub GraphQL API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ env.LOGIN }}
          OUT_DIR: ${{ env.OUT_DIR }}
          LIGHT_NAME: ${{ env.LIGHT_NAME }}
          DARK_NAME: ${{ env.DARK_NAME }}
          TITLE: ${{ env.TITLE }}
        run: |
          node scripts/generate-gh-contribs.js \
            --login "$LOGIN" \
            --out "$OUT_DIR" \
            --light "$LIGHT_NAME" \
            --dark "$DARK_NAME" \
            --title "$TITLE"

      - name: Commit & push if changed
        run: |
          set -e
          git add "${{ env.OUT_DIR }}/${{ env.LIGHT_NAME }}" "${{ env.OUT_DIR }}/${{ env.DARK_NAME }}"
          if ! git diff --staged --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(gh-activity): refresh contributions calendar SVGs"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Unable to rebase the generated commit onto origin/main." >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt ${attempt} lost a race; retrying."
              sleep 2
            done
            echo "Failed to push the generated contribution calendars after 3 attempts." >&2
            exit 1
          else
            echo "No changes to commit"
          fi
