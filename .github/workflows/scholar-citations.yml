name: scholar-citations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 17 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scholar-citations.yml"
      - "scripts/update-scholar-citations.js"

concurrency:
  group: generated-main-writer
  cancel-in-progress: false

permissions:
  contents: write

env:
  SCHOLAR_USER_ID: "H8fc2JgAAAAJ"
  SCHOLAR_CITATION_PROVIDER: "serpapi"
  SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Refresh Google Scholar count
        run: node scripts/update-scholar-citations.js

      - name: Rebuild citation display
        run: node scripts/build-site.js

      - name: Commit refreshed count if changed
        run: |
          git add content/citations.json index.html
          if ! git diff --staged --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(scholar): refresh citation count"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "Unable to rebase the generated commit onto origin/main." >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt ${attempt} lost a race; retrying."
              sleep 2
            done
            echo "Failed to push the refreshed citation count after 3 attempts." >&2
            exit 1
          else
            echo "Citation count is already current"
          fi
